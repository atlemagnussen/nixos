apiVersion: v1
kind: Pod
metadata:
  name: ai-product-search
  namespace: default
spec:
  containers:
  - name: ollama
    image: ollama/ollama:latest
    ports:
    - containerPort: 11434
      protocol: TCP
    volumes:
    - name: ollama-data
      mountPath: /root/.ollama
    environment:
    - name: NVIDIA_VISIBLE_DEVICES
      value: "all"
    - name: NVIDIA_DRIVER_CAPABILITIES
      value: "compute,utility"
    resources:
      limits:
        nvidia.com/gpu: "1"
    securityContext:
      privileged: true

  - name: searxng
    image: searxng/searxng:latest
    ports:
    - containerPort: 8080
      protocol: TCP
    volumes:
    - name: searxng-config
      mountPath: /etc/searxng
    environment:
    - name: BASE_URL
      value: "http://localhost:8091/"
    - name: INSTANCE_NAME
      value: "Local Search"

  - name: search-agent
    image: localhost/ai-search-agent:latest
    ports:
    - containerPort: 8000
      protocol: TCP
    volumes:
    - name: search-db
      mountPath: /app/db
    environment:
    - name: OLLAMA_BASE_URL
      value: "http://ollama:11434"
    - name: SEARXNG_BASE_URL
      value: "http://searxng:8080"
    - name: DB_PATH
      value: "/app/db/products.db"
    - name: MODEL_NAME
      value: "qwen:instruct"
    depends_on:
    - ollama
    - searxng

  volumes:
  - name: ollama-data
    persistentVolumeClaim:
      claimName: ollama-pvc
  - name: searxng-config
    configMap:
      name: searxng-config
  - name: search-db
    persistentVolumeClaim:
      claimName: search-db-pvc

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-pvc
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: search-db-pvc
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: v1
kind: Service
metadata:
  name: ai-search-service
spec:
  selector:
    name: ai-product-search
  ports:
  - name: web
    port: 8090
    targetPort: 8000
  - name: ollama
    port: 11434
    targetPort: 11434
  - name: search
    port: 8091
    targetPort: 8080
  type: ClusterIP
