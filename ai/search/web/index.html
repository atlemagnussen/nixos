<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>AI Product Search</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                padding: 20px;
            }

            .container {
                max-width: 1200px;
                margin: 0 auto;
            }

            header {
                text-align: center;
                color: white;
                margin-bottom: 40px;
            }

            header h1 {
                font-size: 2.5em;
                margin-bottom: 10px;
            }

            header p {
                font-size: 1.1em;
                opacity: 0.9;
            }

            .search-box {
                background: white;
                border-radius: 12px;
                padding: 30px;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
                margin-bottom: 30px;
            }

            .search-form {
                display: flex;
                gap: 10px;
                margin-bottom: 20px;
            }

            .search-form input {
                flex: 1;
                padding: 15px 20px;
                border: 2px solid #e0e0e0;
                border-radius: 8px;
                font-size: 1em;
                transition: border-color 0.3s;
            }

            .search-form input:focus {
                outline: none;
                border-color: #667eea;
            }

            .search-form button {
                padding: 15px 40px;
                background: #667eea;
                color: white;
                border: none;
                border-radius: 8px;
                font-size: 1em;
                font-weight: 600;
                cursor: pointer;
                transition: background 0.3s;
            }

            .search-form button:hover {
                background: #5568d3;
            }

            .search-form button:disabled {
                background: #ccc;
                cursor: not-allowed;
            }

            .examples {
                color: #666;
                font-size: 0.9em;
                margin-bottom: 15px;
            }

            .examples strong {
                display: block;
                margin-bottom: 8px;
            }

            .examples ul {
                list-style: none;
                margin-left: 20px;
            }

            .examples li:before {
                content: "→ ";
                color: #667eea;
            }

            .loading {
                text-align: center;
                color: #667eea;
                font-weight: 600;
            }

            .loading span {
                display: inline-block;
                animation: spin 1s linear infinite;
            }

            @keyframes spin {
                0% {
                    transform: rotate(0deg);
                }

                100% {
                    transform: rotate(360deg);
                }
            }

            .results {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
                gap: 20px;
            }

            .product-card {
                background: white;
                border-radius: 12px;
                padding: 20px;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
                transition: transform 0.3s, box-shadow 0.3s;
            }

            .product-card:hover {
                transform: translateY(-5px);
                box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            }

            .product-card h3 {
                color: #333;
                margin-bottom: 10px;
                font-size: 1.1em;
                line-height: 1.3;
            }

            .product-card .price {
                font-size: 1.5em;
                color: #667eea;
                font-weight: bold;
                margin: 15px 0;
            }

            .product-card .source {
                display: inline-block;
                background: #f0f0f0;
                color: #666;
                padding: 4px 12px;
                border-radius: 20px;
                font-size: 0.85em;
                margin-bottom: 10px;
            }

            .product-card .description {
                color: #666;
                font-size: 0.9em;
                margin: 10px 0;
                line-height: 1.4;
            }

            .product-card .specs {
                background: #f9f9f9;
                padding: 10px;
                border-radius: 6px;
                font-size: 0.85em;
                color: #555;
                margin: 10px 0;
            }

            .product-card .specs strong {
                display: block;
                margin-bottom: 5px;
                color: #333;
            }

            .product-card a {
                display: inline-block;
                margin-top: 15px;
                padding: 10px 20px;
                background: #667eea;
                color: white;
                text-decoration: none;
                border-radius: 6px;
                font-size: 0.9em;
                transition: background 0.3s;
            }

            .product-card a:hover {
                background: #5568d3;
            }

            .stats {
                background: white;
                border-radius: 12px;
                padding: 20px;
                margin-top: 30px;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            }

            .stats h3 {
                margin-bottom: 15px;
                color: #333;
            }

            .stat-row {
                display: flex;
                justify-content: space-around;
                flex-wrap: wrap;
                gap: 20px;
            }

            .stat-item {
                text-align: center;
            }

            .stat-value {
                font-size: 1.8em;
                color: #667eea;
                font-weight: bold;
            }

            .stat-label {
                color: #666;
                font-size: 0.9em;
            }

            .error {
                background: #fee;
                color: #c33;
                padding: 15px;
                border-radius: 8px;
                margin-bottom: 20px;
                border-left: 4px solid #c33;
            }

            .success {
                background: #efe;
                color: #3c3;
                padding: 15px;
                border-radius: 8px;
                margin-bottom: 20px;
                border-left: 4px solid #3c3;
            }
        </style>
    </head>

    <body>
        <div class="container">
            <header>
                <h1>🔍 AI Product Search</h1>
                <p>Find the best deals on products using local AI</p>
            </header>

            <div class="search-box">
                <div class="search-form">
                    <input type="text" id="searchInput"
                        placeholder="Try: Find 27-inch 4K monitors under 500 EUR with USB-C and VESA"
                        onkeypress="handleKeyPress(event)">
                    <button onclick="performSearch()" id="searchBtn">Search</button>
                </div>

                <div class="examples">
                    <strong>💡 Try searching for:</strong>
                    <ul>
                        <li>27-inch 4K monitors under 500 EUR with USB-C</li>
                        <li>Gaming laptops with RTX 4060 under 1500 EUR</li>
                        <li>Wireless headphones with noise cancellation</li>
                        <li>Smart watches under 200 USD with SpO2</li>
                    </ul>
                </div>
            </div>

            <div id="message"></div>
            <div id="results"></div>
            <div id="stats"></div>
        </div>

        <script>
            let lastQuery = '';

            async function performSearch() {
                const query = document.getElementById('searchInput').value.trim();

                if (!query) {
                    showMessage('Please enter a search query', 'error');
                    return;
                }

                lastQuery = query;
                const btn = document.getElementById('searchBtn');
                btn.disabled = true;
                btn.textContent = 'Searching...';

                showMessage('<div class="loading"><span>⏳</span> Searching...</div>', 'success');

                try {
                    const response = await fetch('/search', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            query: query,
                            max_results: 20,
                            filters: {}
                        })
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const data = await response.json();
                    displayResults(data);
                    loadStats();

                } catch (error) {
                    showMessage(`Error: ${error.message}`, 'error');
                } finally {
                    btn.disabled = false;
                    btn.textContent = 'Search';
                }
            }

            function displayResults(data) {
                const resultsDiv = document.getElementById('results');

                if (!data.results || data.results.length === 0) {
                    showMessage('No results found. Try a different search query.', 'error');
                    resultsDiv.innerHTML = '';
                    return;
                }

                let html = `<h2>Found ${data.results.length} products (${data.processing_time.toFixed(2)}s)</h2><div class="results">`;

                data.results.forEach(product => {
                    html += `
                    <div class="product-card">
                        <div class="source">${escapeHtml(product.source)}</div>
                        <h3>${escapeHtml(product.name)}</h3>
                        ${product.price ? `<div class="price">${product.price.toFixed(2)} ${product.currency}</div>` : ''}
                        ${product.description ? `<p class="description">${escapeHtml(product.description.substring(0, 100))}...</p>` : ''}
                        ${Object.keys(product.specs).length > 0 ? `
                            <div class="specs">
                                <strong>Specs:</strong>
                                ${Object.entries(product.specs).slice(0, 3).map(([k, v]) =>
                        `<div>• ${escapeHtml(String(k))}: ${escapeHtml(String(v))}</div>`
                    ).join('')}
                            </div>
                        ` : ''}
                        <a href="${escapeHtml(product.url)}" target="_blank">View Product →</a>
                        <div style="font-size: 0.8em; color: #999; margin-top: 10px;">${new Date(product.found_at).toLocaleDateString()}</div>
                    </div>
                `;
                });

                html += '</div>';
                resultsDiv.innerHTML = html;
                showMessage(`✅ Found ${data.results.length} products matching your criteria`, 'success');
            }

            async function loadStats() {
                try {
                    const response = await fetch('/stats');
                    const data = await response.json();

                    const statsDiv = document.getElementById('stats');
                    statsDiv.innerHTML = `
                    <h3>📊 Database Statistics</h3>
                    <div class="stat-row">
                        <div class="stat-item">
                            <div class="stat-value">${data.total_products}</div>
                            <div class="stat-label">Total Products</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">${data.unique_sources}</div>
                            <div class="stat-label">Unique Sources</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">${data.price_stats.min ? data.price_stats.min.toFixed(2) : 'N/A'}</div>
                            <div class="stat-label">Min Price</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">${data.price_stats.max ? data.price_stats.max.toFixed(2) : 'N/A'}</div>
                            <div class="stat-label">Max Price</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">${data.price_stats.average ? data.price_stats.average.toFixed(2) : 'N/A'}</div>
                            <div class="stat-label">Avg Price</div>
                        </div>
                    </div>
                `;
                } catch (error) {
                    console.error('Failed to load stats:', error);
                }
            }

            function showMessage(message, type) {
                const messageDiv = document.getElementById('message');
                messageDiv.innerHTML = `<div class="${type}">${message}</div>`;
            }

            function handleKeyPress(event) {
                if (event.key === 'Enter') {
                    performSearch();
                }
            }

            function escapeHtml(text) {
                const map = {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                };
                return text.replace(/[&<>"']/g, m => map[m]);
            }

            // Load stats on page load
            window.addEventListener('load', loadStats);
        </script>
    </body>

</html>
