# SearXNG configuration for product search

server:
  port: 8080
  bind_address: "0.0.0.0"
  base_url: http://localhost:8080/
  instance_name: "Local Product Search"

search:
  safe_search: 0
  autocomplete: "google"
  default_lang: "all"
  autocomplete_min: 4

ui:
  static_path: "/usr/local/searxng/searx/static"
  templates_path: "/usr/local/searxng/searx/templates"
  theme_args:
    oscar_style: "logicodev"

redis:
  url: redis://localhost:6379/0

outgoing:
  request_timeout: 30.0
  max_request_timeout: 120.0
  pool_connections: 100
  pool_maxsize: 10

engines:
  - name: amazon
    engine: amazon
    shortcut: az
    base_url: 'https://amazon.com'
    disabled: false

  - name: ebay
    engine: ebay
    shortcut: eb
    base_url: 'https://ebay.com'
    disabled: false

  - name: google
    engine: google
    shortcut: go
    disabled: false

  - name: bing
    engine: bing
    shortcut: bi
    disabled: false

  - name: duckduckgo
    engine: duckduckgo
    shortcut: dd
    disabled: false

  - name: qwant
    engine: qwant
    shortcut: qw
    disabled: false

  - name: startpage
    engine: startpage
    shortcut: sp
    url: 'https://www.startpage.com/'
    disabled: false
