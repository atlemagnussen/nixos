apiVersion: v1
kind: Pod
metadata:
  name: wafPod
  labels:
    app: wafPod
spec:
  restartPolicy: Always
  dnsPolicy: None
  dnsConfig:
    nameservers:
      - 192.168.1.1
      - 1.1.1.1
    options:
      - name: ndots
        value: "1"
  containers:
    - name: bunkerweb-aio
      image: bunkerity/bunkerweb-all-in-one:1.6.9
      imagePullPolicy: IfNotPresent
      ports:
        - name: http
          containerPort: 8080
          hostPort: 80
          protocol: TCP
        - name: https-tcp
          containerPort: 8443
          hostPort: 443
          protocol: TCP
        - name: https-udp
          containerPort: 8443
          hostPort: 443
          protocol: UDP
      env:
        - name: TZ
          value: Europe/Oslo
        - name: DNS_RESOLVERS
          value: 192.168.1.1
      volumeMounts:
        - name: bw-data
          mountPath: /data
  volumes:
    - name: bw-data
      persistentVolumeClaim:
        claimName: bw-data
