apiVersion: v1
kind: Pod
metadata:
  name: wafPod
  labels:
    app: wafPod
spec:
  restartPolicy: Always
  containers:
    - name: bunkerweb-aio
      image: bunkerity/bunkerweb-all-in-one:1.6.9
      imagePullPolicy: IfNotPresent
      ports:
        - name: http
          containerPort: 8080
          hostPort: 80
          protocol: TCP
        - name: https-tcp
          containerPort: 8443
          hostPort: 443
          protocol: TCP
        - name: https-udp
          containerPort: 8443
          hostPort: 443
          protocol: UDP
      env:
        - name: TZ
          value: Europe/Oslo
      volumeMounts:
        - name: bw-data
          mountPath: /data
  volumes:
    - name: bw-data
      persistentVolumeClaim:
        claimName: bw-data
